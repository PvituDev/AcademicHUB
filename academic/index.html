<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <title>AcademicHub - IF Goiano</title>

    <script src="https://cdn.tailwindcss.com"></script>
 
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
      .fc {
        --fc-border-color: #334155;
        --fc-page-bg-color: #0f172a;
        --fc-neutral-bg-color: #1e293b;
        --fc-list-event-hover-bg-color: #334155;
        color: #f8fafc;
      }
      .fc .fc-toolbar-title {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .fc .fc-button-primary {
        background-color: #059669;
        border-color: #059669;
      }
      .fc .fc-button-primary:hover {
        background-color: #047857;
        border-color: #047857;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- CONFIGURAÇÃO DA API BACKEND ---
      const API_URL = "https://amc-code0.onrender.com/api";

      // --- FILTRO AUTOMÁTICO DE LINGUAGEM OFENSIVA (1ª camada no cliente) ---
      const PALAVRAS_BLOQUEADAS = [
        "idiota", "burro", "burra", "imbecil", "estupido", "estúpido",
        "estupida", "estúpida", "otario", "otário", "otaria", "otária",
        "lixo", "inutil", "inútil", "porra", "merda", "bosta", "cretino",
        "cretina", "retardado", "retardada", "vagabundo", "vagabunda",
        "escroto", "escrota", "desgraçado", "desgraçada", "vadia",
        "vadio", "puta", "viado", "bicha", "gordo demais", "feio pra caramba",
      ];

      function normalizarTexto(txt) {
        return txt
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      function contemOfensa(texto) {
        const normalizado = normalizarTexto(texto);
        return PALAVRAS_BLOQUEADAS.some((palavra) =>
          normalizado.includes(normalizarTexto(palavra))
        );
      }

      // Grade padrão caso a rota /api/grade ainda não esteja no ar
      const GRADE_PADRAO = {
        turma: "2º ano Téc. Informática — IF Goiano",
        slots: [
          {
            turno: "Matutino",
            horario: "08:00 - 09:00",
            dias: {
              segunda: { disciplina: "Eletrônica Básica", professor: "André Wild" },
              terca: { disciplina: "Filosofia II - Info", professor: "Flávio Oliveira" },
              quarta: { disciplina: "Sociologia II - Info", professor: "Maria Otavia" },
              quinta: { disciplina: "Língua Portuguesa e Lit. II", professor: "Mariana Rodrigues" },
              sexta: { disciplina: "Inglês II - Info", professor: "Milton Cássio" },
            },
          },
          {
            turno: "Matutino",
            horario: "09:00 - 10:00",
            dias: {
              segunda: { disciplina: "Eletrônica Básica", professor: "André Wild" },
              terca: { disciplina: "Filosofia II - Info", professor: "Flávio Oliveira" },
              quarta: { disciplina: "Educação Física II - Info", professor: "Thalita Cintra" },
              quinta: { disciplina: "Desenvolvimento Web II", professor: "Franciele INFO" },
              sexta: { disciplina: "Inglês II - Info", professor: "Milton Cássio" },
            },
          },
          {
            turno: "Matutino",
            horario: "10:20 - 11:20",
            dias: {
              segunda: { disciplina: "Geografia II - Info", professor: "Laise Cabral" },
              terca: { disciplina: "Química II - Info", professor: "Gustavo" },
              quarta: { disciplina: "Língua Portuguesa e Lit. II", professor: "Mariana Rodrigues" },
              quinta: { disciplina: "Desenvolvimento Web II", professor: "Franciele INFO" },
              sexta: { disciplina: "Biologia II - Info", professor: "Karine Dias" },
            },
          },
          {
            turno: "Matutino",
            horario: "11:20 - 12:20",
            dias: {
              segunda: null,
              terca: { disciplina: "Química II - Info", professor: "Gustavo" },
              quarta: { disciplina: "Matemática II - Info", professor: "Pedro Cortes" },
              quinta: { disciplina: "Língua Portuguesa e Lit. II", professor: "Mariana Rodrigues" },
              sexta: { disciplina: "Biologia II - Info", professor: "Karine Dias" },
            },
          },
          {
            turno: "Vespertino",
            horario: "13:50 - 14:50",
            dias: {
              segunda: { disciplina: "Paradigma Orientação Objeto", professor: "Renato" },
              terca: null,
              quarta: { disciplina: "História II - Info", professor: "Daniel" },
              quinta: null,
              sexta: { disciplina: "Física II - Info", professor: "Elisângela" },
            },
          },
          {
            turno: "Vespertino",
            horario: "14:50 - 15:50",
            dias: {
              segunda: { disciplina: "Paradigma Orientação Objeto", professor: "Renato" },
              terca: null,
              quarta: { disciplina: "História II - Info", professor: "Daniel" },
              quinta: null,
              sexta: { disciplina: "Física II - Info", professor: "Elisângela" },
            },
          },
          {
            turno: "Vespertino",
            horario: "16:00 - 17:00",
            dias: {
              segunda: { disciplina: "Artes - Info", professor: "Daivdson" },
              terca: null,
              quarta: { disciplina: "Tópicos I - Informática", professor: "Franciele INFO" },
              quinta: null,
              sexta: { disciplina: "Matemática II - Info", professor: "Pedro Cortes" },
            },
          },
          {
            turno: "Vespertino",
            horario: "17:00 - 18:00",
            dias: {
              segunda: null,
              terca: null,
              quarta: { disciplina: "Tópicos I - Informática", professor: "Franciele INFO" },
              quinta: null,
              sexta: { disciplina: "Matemática II - Info", professor: "Pedro Cortes" },
            },
          },
        ],
      };

      function App() {
        const [eventos, setEventos] = useState([]);
        const [materiais, setMateriais] = useState([]);
        const [gradeHoraria, setGradeHoraria] = useState(GRADE_PADRAO);
        const [aba, setAba] = useState("dashboard");

        // Estado encapsulado do usuário autenticado (Polimorfismo de permissões)
        const [senhaEditor, setSenhaEditor] = useState("");
        const [usuarioAtual, setUsuarioAtual] = useState({
          nome: "Estudante",
          cargo: "Aluno",
          permissoes: ["ler_provas", "ler_materiais", "postar_forum"],
        });

        // Helpers baseados nas permissões retornadas pela classe Representante/Aluno
        const temPermissao = (perm) => usuarioAtual.permissoes.includes(perm);
        const isEditor = temPermissao("criar_provas");

        // Formulário de Atividades
        const [titulo, setTitulo] = useState("");
        const [descricao, setDescricao] = useState("");
        const [tipo, setTipo] = useState("prova");
        const [dataHora, setDataHora] = useState("");
        const [editandoId, setEditandoId] = useState(null);

        // Formulário de Materiais PDF
        const [nomeMaterial, setNomeMaterial] = useState("");
        const [arquivoPDF, setArquivoPDF] = useState(null);
        const [disciplina, setDisciplina] = useState("");
        const [enviando, setEnviando] = useState(false);

        // Fórum de sugestões
        const [forumPosts, setForumPosts] = useState([]);
        const [forumNome, setForumNome] = useState("");
        const [forumTexto, setForumTexto] = useState("");
        const [forumErro, setForumErro] = useState("");
        const [forumEnviando, setForumEnviando] = useState(false);

        const calendarRef = useRef(null);
        const calendarInstanceRef = useRef(null);

        // Carregar eventos polimórficos do Backend (Prova, Dever, Evento)
        const carregarEventos = async () => {
          try {
            const resposta = await fetch(`${API_URL}/provas`);
            if (!resposta.ok) throw new Error("Erro na rede");
            const data = await resposta.json();

            const hoje = new Date().toISOString().slice(0, 10);
            const validos = [];
            const expirados = [];

            data.forEach((item) => {
              const dataItem = (item.start || "").slice(0, 10);
              const vencida =
                typeof item.vencida === "boolean"
                  ? item.vencida
                  : dataItem && dataItem < hoje;

              if (vencida) {
                expirados.push(item);
              } else {
                validos.push(item);
              }
            });

            if (expirados.length > 0 && senhaEditor) {
              await Promise.all(
                expirados.map((item) =>
                  fetch(`${API_URL}/provas/${item.id}`, {
                    method: "DELETE",
                    headers: { "x-admin-password": senhaEditor },
                  }).catch((err) =>
                    console.error("Erro ao excluir atividade vencida:", err)
                  )
                )
              );
            }

            const formatados = validos.map((item) => ({
              id: String(item.id),
              // Usa o título e a cor definidos polimorficamente pelas subclasses no backend
              title:
                item.tituloFormatado ||
                `[${item.tipo ? item.tipo.toUpperCase() : "EVENTO"}] ${item.title}`,
              start: item.start,
              color:
                item.cor ||
                (item.tipo === "prova"
                  ? "#dc2626"
                  : item.tipo === "dever"
                    ? "#d97706"
                    : item.tipo === "evento"
                      ? "#8b5cf6"
                      : "#2563eb"),
              tipo: item.tipo,
              nomeOriginal: item.title,
              descricao: item.descricao || "Sem descrição cadastrada.",
            }));
            setEventos(formatados);
          } catch (err) {
            console.error("Erro ao carregar eventos:", err);
          }
        };

        // Carregar materiais em PDF do Backend
        const carregarMateriais = async () => {
          try {
            const resposta = await fetch(`${API_URL}/materiais`);
            if (!resposta.ok) throw new Error("Erro na rede");
            const data = await resposta.json();
            setMateriais(data);
          } catch (err) {
            console.error("Erro ao carregar materiais:", err);
          }
        };

        // Carregar posts do Fórum
        const carregarForum = async () => {
          try {
            const resposta = await fetch(`${API_URL}/forum`);
            if (!resposta.ok) throw new Error("Erro na rede");
            const data = await resposta.json();
            setForumPosts(data);
          } catch (err) {
            console.error("Erro ao carregar fórum:", err);
          }
        };

        // Carregar Grade Horária estruturada do Backend
        const carregarGrade = async () => {
          try {
            const resposta = await fetch(`${API_URL}/grade`);
            if (resposta.ok) {
              const data = await resposta.json();
              if (data && data.slots) setGradeHoraria(data);
            }
          } catch (err) {
            // Mantém GRADE_PADRAO em caso de falha
          }
        };

        useEffect(() => {
          carregarEventos();
          carregarMateriais();
          carregarForum();
          carregarGrade();

          const intervalo = setInterval(carregarEventos, 5 * 60 * 1000);
          return () => clearInterval(intervalo);
        }, []);

        // Renderizar Calendário
        useEffect(() => {
          if (aba === "calendario" && calendarRef.current) {
            if (calendarInstanceRef.current) {
              calendarInstanceRef.current.destroy();
            }
            const calendar = new FullCalendar.Calendar(calendarRef.current, {
              initialView: "dayGridMonth",
              locale: "pt-br",
              headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek",
              },
              events: eventos,
              height: "75vh",
            });
            calendar.render();
            calendarInstanceRef.current = calendar;
          }
        }, [aba, eventos]);

        const autenticarRepresentante = async () => {
          if (isEditor) {
            setSenhaEditor("");
            setUsuarioAtual({
              nome: "Estudante",
              cargo: "Aluno",
              permissoes: ["ler_provas", "ler_materiais", "postar_forum"],
            });
            alert("Modo Editor desativado.");
            return;
          }
          const senhaDigitada = prompt("Digite a senha de Representante:");
          if (!senhaDigitada) return;

          try {
            const resposta = await fetch(`${API_URL}/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ senha: senhaDigitada }),
            });

            const resultado = await resposta.json();

            if (resposta.ok && resultado.success) {
              setSenhaEditor(senhaDigitada);
              if (resultado.usuario) {
                setUsuarioAtual(resultado.usuario);
              } else {
                setUsuarioAtual({
                  nome: "Representante",
                  cargo: "Representante",
                  permissoes: [
                    "ler_provas",
                    "ler_materiais",
                    "postar_forum",
                    "criar_provas",
                    "editar_provas",
                    "deletar_provas",
                    "publicar_materiais",
                    "moderar_forum",
                  ],
                });
              }
              alert("Acesso concedido!");
            } else {
              alert("Senha incorreta!");
            }
          } catch (error) {
            alert("Erro ao validar senha no servidor.");
          }
        };

        const iniciarEdicao = (evt) => {
          setEditandoId(evt.id);
          setTitulo(evt.nomeOriginal);
          setDescricao(
            evt.descricao === "Sem descrição cadastrada." ? "" : evt.descricao
          );
          setTipo(evt.tipo);
          setDataHora((evt.start || "").slice(0, 10));
          setAba("dashboard");
        };

        const cancelarEdicao = () => {
          setEditandoId(null);
          setTitulo("");
          setDescricao("");
          setTipo("prova");
          setDataHora("");
        };

        const salvarEvento = async (e) => {
          e.preventDefault();
          if (!titulo || !dataHora) return;

          const url = editandoId
            ? `${API_URL}/provas/${editandoId}`
            : `${API_URL}/provas`;
          const method = editandoId ? "PUT" : "POST";

          try {
            const resposta = await fetch(url, {
              method,
              headers: {
                "Content-Type": "application/json",
                "x-admin-password": senhaEditor,
              },
              body: JSON.stringify({
                title: titulo,
                tipo: tipo,
                start: dataHora,
                descricao: descricao,
              }),
            });

            if (resposta.ok) {
              alert(
                editandoId
                  ? "Atividade atualizada com sucesso!"
                  : "Evento publicado com sucesso!"
              );
              cancelarEdicao();
              carregarEventos();
            } else {
              const erro = await resposta.json();
              alert("Erro: " + (erro.error || "Erro desconhecido"));
            }
          } catch (error) {
            alert("Erro ao conectar ao servidor.");
          }
        };

        const deletarEvento = async (id) => {
          if (!confirm("Tem certeza que deseja apagar?")) return;
          try {
            const resposta = await fetch(`${API_URL}/provas/${id}`, {
              method: "DELETE",
              headers: {
                "x-admin-password": senhaEditor,
              },
            });
            if (resposta.ok) {
              if (editandoId === id) cancelarEdicao();
              carregarEventos();
            } else {
              const erro = await resposta.json();
              alert("Erro ao deletar: " + (erro.error || "Erro"));
            }
          } catch (error) {
            console.error("Erro ao deletar:", error);
          }
        };

        const publicarMaterial = async (e) => {
          e.preventDefault();
          if (!nomeMaterial || !arquivoPDF) return;

          try {
            setEnviando(true);

            const formData = new FormData();
            formData.append("nome", nomeMaterial);
            formData.append("disciplina", disciplina || "Geral");
            formData.append("arquivo", arquivoPDF);

            const resposta = await fetch(`${API_URL}/materiais`, {
              method: "POST",
              headers: {
                "x-admin-password": senhaEditor,
              },
              body: formData,
            });

            if (resposta.ok) {
              alert("Material enviado com sucesso!");
              setNomeMaterial("");
              setDisciplina("");
              setArquivoPDF(null);
              carregarMateriais();
            } else {
              const erro = await resposta.json();
              alert("Erro ao salvar o material: " + (erro.error || "Erro"));
            }
          } catch (error) {
            alert("Erro: " + error.message);
          } finally {
            setEnviando(false);
          }
        };

        const deletarMaterial = async (id) => {
          if (!confirm("Tem certeza que deseja excluir?")) return;
          try {
            const resposta = await fetch(`${API_URL}/materiais/${id}`, {
              method: "DELETE",
              headers: {
                "x-admin-password": senhaEditor,
              },
            });
            if (resposta.ok) {
              carregarMateriais();
            } else {
              const erro = await resposta.json();
              alert("Erro ao deletar material: " + (erro.error || "Erro"));
            }
          } catch (error) {
            console.error("Erro ao deletar:", error);
          }
        };

        const publicarForum = async (e) => {
          e.preventDefault();
          setForumErro("");

          if (!forumNome.trim() || !forumTexto.trim()) {
            setForumErro("Preencha seu nome e a sugestão antes de enviar.");
            return;
          }

          if (contemOfensa(forumNome) || contemOfensa(forumTexto)) {
            setForumErro(
              "Sua mensagem contém linguagem ofensiva e não pôde ser publicada. Por favor, reescreva de forma construtiva — o objetivo do fórum é sugerir melhorias, não atacar pessoas."
            );
            return;
          }

          try {
            setForumEnviando(true);
            const resposta = await fetch(`${API_URL}/forum`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                nome: forumNome.trim(),
                texto: forumTexto.trim(),
              }),
            });

            if (resposta.ok) {
              setForumNome("");
              setForumTexto("");
              carregarForum();
            } else {
              const erro = await resposta.json();
              setForumErro(erro.error || "Erro ao publicar. Tente novamente.");
            }
          } catch (error) {
            setForumErro("Erro ao conectar ao servidor.");
          } finally {
            setForumEnviando(false);
          }
        };

        const deletarForumPost = async (id) => {
          if (!confirm("Tem certeza que deseja apagar esta sugestão?")) return;
          try {
            const resposta = await fetch(`${API_URL}/forum/${id}`, {
              method: "DELETE",
              headers: { "x-admin-password": senhaEditor },
            });
            if (resposta.ok) {
              carregarForum();
            } else {
              const erro = await resposta.json();
              alert("Erro ao deletar: " + (erro.error || "Erro"));
            }
          } catch (error) {
            console.error("Erro ao deletar:", error);
          }
        };

        const slotsMatutino = gradeHoraria.slots.filter(
          (s) => s.turno === "Matutino"
        );
        const slotsVespertino = gradeHoraria.slots.filter(
          (s) => s.turno === "Vespertino"
        );

        const renderCelulaAula = (aula) => {
          if (!aula) return <td className="p-3 text-slate-500">-</td>;
          return (
            <td className="p-3">
              <div className="font-semibold text-white">{aula.disciplina}</div>
              <div className="text-xs text-slate-400">{aula.professor}</div>
            </td>
          );
        };

        return (
          <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 font-sans">
            {/* Sidebar */}
            <aside className="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-3 mb-8">
                  <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-emerald-900/40">
                    IF
                  </div>
                  <div>
                    <h1 className="font-bold text-lg tracking-wide text-white">
                      AcademicHub
                    </h1>
                    <span className="text-xs text-slate-400">
                      2º Téc. Informática
                    </span>
                  </div>
                </div>

                <nav className="space-y-2">
                  <button
                    onClick={() => setAba("dashboard")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "dashboard" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📖 Painel Principal
                  </button>
                  <button
                    onClick={() => setAba("grade")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "grade" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📊 Grade Horária
                  </button>
                  <button
                    onClick={() => setAba("materiais")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "materiais" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📄 Materiais & PDFs
                  </button>
                  <button
                    onClick={() => setAba("calendario")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "calendario" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    📅 Calendário
                  </button>
                  <button
                    onClick={() => setAba("forum")}
                    className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${aba === "forum" ? "bg-emerald-600/10 text-emerald-400 border border-emerald-500/20" : "text-slate-400 hover:bg-slate-800"}`}
                  >
                    💬 Fórum
                  </button>
                </nav>
              </div>

              <div className="mt-6 md:mt-0 space-y-3">
                <div className="text-center text-xs text-slate-500">
                  Perfil: <span className="text-slate-300 font-medium">{usuarioAtual.cargo}</span>
                </div>
                <button
                  onClick={autenticarRepresentante}
                  className={`w-full text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition ${isEditor ? "bg-amber-500/20 text-amber-400 border border-amber-500/30" : "bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700"}`}
                >
                  {isEditor ? "🔓 Modo Editor" : "🔒 Acesso Representante"}
                </button>
              </div>
            </aside>

            {/* Conteúdo */}
            <main className="flex-1 p-4 md:p-8 overflow-y-auto">
              {aba === "dashboard" && (
                <div className="max-w-5xl mx-auto space-y-8">
                  <header>
                    <h2 className="text-2xl font-bold text-white mb-4">
                      Mural de Atividades
                    </h2>
                    <p className="text-slate-500 text-xs">
                      Atividades são removidas automaticamente assim que a data
                      de prazo passa.
                    </p>
                  </header>

                  {temPermissao("criar_provas") && (
                    <form
                      onSubmit={salvarEvento}
                      className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4 mb-8"
                    >
                      <div className="flex items-center justify-between">
                        <h3 className="font-semibold text-emerald-400">
                          {editandoId
                            ? "Editando Atividade"
                            : "Adicionar Nova Atividade"}
                        </h3>
                        {editandoId && (
                          <button
                            type="button"
                            onClick={cancelarEdicao}
                            className="text-xs text-slate-400 hover:text-white underline"
                          >
                            Cancelar edição
                          </button>
                        )}
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input
                          type="text"
                          placeholder="Título (Ex: Prova de Matemática)"
                          value={titulo}
                          onChange={(e) => setTitulo(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                          required
                        />
                        <select
                          value={tipo}
                          onChange={(e) => setTipo(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                        >
                          <option value="prova">Prova</option>
                          <option value="dever">Dever de Casa</option>
                          <option value="evento">Evento / Reunião</option>
                        </select>
                        <input
                          type="date"
                          value={dataHora}
                          onChange={(e) => setDataHora(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                          required
                        />
                        <input
                          type="text"
                          placeholder="Detalhes (Opcional)"
                          value={descricao}
                          onChange={(e) => setDescricao(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                        />
                      </div>
                      <button
                        type="submit"
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg transition"
                      >
                        {editandoId ? "Salvar Alterações" : "Publicar"}
                      </button>
                    </form>
                  )}

                  <div className="grid grid-cols-1 gap-4">
                    {eventos.map((evt) => (
                      <div
                        key={evt.id}
                        className={`bg-slate-900 border p-4 rounded-xl flex justify-between items-center ${editandoId === evt.id ? "border-emerald-500/50" : "border-slate-800"}`}
                      >
                        <div>
                          <span
                            style={{ color: evt.color }}
                            className="font-bold text-sm mr-2"
                          >
                            {evt.tipo.toUpperCase()}
                          </span>
                          <span className="text-white font-medium">
                            {evt.nomeOriginal}
                          </span>
                          <p className="text-slate-400 text-sm mt-1">
                            {evt.descricao}
                          </p>
                          <p className="text-slate-500 text-xs mt-2">
                            Prazo: {evt.start}
                          </p>
                        </div>
                        {temPermissao("editar_provas") && (
                          <div className="flex gap-2 shrink-0 ml-4">
                            <button
                              onClick={() => iniciarEdicao(evt)}
                              className="bg-blue-500/10 text-blue-400 px-3 py-1 rounded hover:bg-blue-500/20 transition"
                            >
                              Editar
                            </button>
                            <button
                              onClick={() => deletarEvento(evt.id)}
                              className="bg-red-500/10 text-red-400 px-3 py-1 rounded hover:bg-red-500/20 transition"
                            >
                              Apagar
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                    {eventos.length === 0 && (
                      <p className="text-slate-500">
                        Nenhuma atividade agendada.
                      </p>
                    )}
                  </div>
                </div>
              )}

              {aba === "calendario" && (
                <div className="max-w-5xl mx-auto space-y-4">
                  <h2 className="text-2xl font-bold text-white mb-4">
                    Calendário
                  </h2>
                  <div
                    ref={calendarRef}
                    className="bg-slate-900 p-4 rounded-xl border border-slate-800"
                  ></div>
                </div>
              )}

              {aba === "materiais" && (
                <div className="max-w-5xl mx-auto space-y-8">
                  <h2 className="text-2xl font-bold text-white mb-4">
                    Materiais & PDFs
                  </h2>

                  {temPermissao("publicar_materiais") && (
                    <form
                      onSubmit={publicarMaterial}
                      className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4"
                    >
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input
                          type="text"
                          placeholder="Nome do Material"
                          value={nomeMaterial}
                          onChange={(e) => setNomeMaterial(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                          required
                        />
                        <input
                          type="text"
                          placeholder="Disciplina"
                          value={disciplina}
                          onChange={(e) => setDisciplina(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                          required
                        />
                        <input
                          type="file"
                          accept="application/pdf"
                          onChange={(e) => setArquivoPDF(e.target.files[0])}
                          className="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white col-span-1 md:col-span-2"
                          required
                        />
                      </div>
                      <button
                        type="submit"
                        disabled={enviando}
                        className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-2 px-6 rounded-lg transition"
                      >
                        {enviando ? "Enviando..." : "Fazer Upload"}
                      </button>
                    </form>
                  )}

                  <div className="grid grid-cols-1 gap-4 mt-6">
                    {materiais.map((mat) => (
                      <div
                        key={mat.id}
                        className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center"
                      >
                        <div>
                          <span className="text-blue-400 font-bold text-sm mr-2">
                            {mat.disciplina}
                          </span>
                          <span className="text-white font-medium">
                            {mat.nome}
                          </span>
                        </div>
                        <div className="flex gap-2">
                          <a
                            href={mat.url}
                            target="_blank"
                            rel="noreferrer"
                            className="bg-slate-800 text-emerald-400 px-3 py-1 rounded hover:bg-slate-700 transition"
                          >
                            Baixar
                          </a>
                          {temPermissao("publicar_materiais") && (
                            <button
                              onClick={() => deletarMaterial(mat.id)}
                              className="bg-red-500/10 text-red-400 px-3 py-1 rounded hover:bg-red-500/20 transition"
                            >
                              Apagar
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                    {materiais.length === 0 && (
                      <p className="text-slate-500">
                        Nenhum material disponível.
                      </p>
                    )}
                  </div>
                </div>
              )}

              {aba === "forum" && (
                <div className="max-w-5xl mx-auto space-y-8">
                  <header>
                    <h2 className="text-2xl font-bold text-white mb-1">
                      Fórum de Sugestões
                    </h2>
                    <p className="text-slate-400 text-sm">
                      Espaço para sugerir melhorias construtivas nos métodos de
                      ensino. Mensagens com linguagem ofensiva são bloqueadas
                      automaticamente antes de serem publicadas.
                    </p>
                  </header>

                  <form
                    onSubmit={publicarForum}
                    className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4"
                  >
                    <div className="grid grid-cols-1 gap-4">
                      <input
                        type="text"
                        placeholder="Seu nome"
                        value={forumNome}
                        onChange={(e) => setForumNome(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white"
                        required
                      />
                      <textarea
                        placeholder="O que você acha que poderia melhorar? (seja construtivo)"
                        value={forumTexto}
                        onChange={(e) => setForumTexto(e.target.value)}
                        rows={4}
                        className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-white resize-none"
                        required
                      />
                    </div>

                    {forumErro && (
                      <p className="text-red-400 text-sm bg-red-500/10 border border-red-500/20 rounded-lg p-3">
                        {forumErro}
                      </p>
                    )}

                    <button
                      type="submit"
                      disabled={forumEnviando}
                      className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-2 px-6 rounded-lg transition"
                    >
                      {forumEnviando ? "Enviando..." : "Publicar Sugestão"}
                    </button>
                  </form>

                  <div className="grid grid-cols-1 gap-4">
                    {forumPosts.map((post) => (
                      <div
                        key={post.id}
                        className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-start"
                      >
                        <div>
                          <span className="text-emerald-400 font-bold text-sm">
                            {post.nome}
                          </span>
                          <p className="text-slate-200 text-sm mt-1">
                            {post.texto}
                          </p>
                          {post.criado_em && (
                            <p className="text-slate-500 text-xs mt-2">
                              {new Date(post.criado_em).toLocaleDateString(
                                "pt-BR"
                              )}
                            </p>
                          )}
                        </div>
                        {temPermissao("moderar_forum") && (
                          <button
                            onClick={() => deletarForumPost(post.id)}
                            className="bg-red-500/10 text-red-400 px-3 py-1 rounded hover:bg-red-500/20 transition shrink-0 ml-4"
                          >
                            Apagar
                          </button>
                        )}
                      </div>
                    ))}
                    {forumPosts.length === 0 && (
                      <p className="text-slate-500">
                        Nenhuma sugestão publicada ainda.
                      </p>
                    )}
                  </div>
                </div>
              )}

              {aba === "grade" && (
                <div className="max-w-6xl mx-auto space-y-6">
                  <header>
                    <h2 className="text-2xl font-bold text-white mb-1">
                      Grade Horária Semanal
                    </h2>
                    <p className="text-slate-400 text-sm">
                      {gradeHoraria.turma}
                    </p>
                  </header>

                  <div className="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <table className="w-full text-left border-collapse text-xs md:text-sm">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400">
                          <th className="p-3 font-semibold w-24">Horário</th>
                          <th className="p-3 font-semibold">Segunda-feira</th>
                          <th className="p-3 font-semibold">Terça-feira</th>
                          <th className="p-3 font-semibold">Quarta-feira</th>
                          <th className="p-3 font-semibold">Quinta-feira</th>
                          <th className="p-3 font-semibold">Sexta-feira</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-slate-200">
                        <tr className="bg-slate-950/40">
                          <td
                            colSpan="6"
                            className="p-2 text-xs font-bold text-emerald-400 tracking-wider uppercase"
                          >
                            Turno Matutino
                          </td>
                        </tr>
                        {slotsMatutino.map((slot, idx) => (
                          <tr key={`mat-${idx}`}>
                            <td className="p-3 font-medium text-slate-400">
                              {slot.horario}
                            </td>
                            {renderCelulaAula(slot.dias.segunda)}
                            {renderCelulaAula(slot.dias.terca)}
                            {renderCelulaAula(slot.dias.quarta)}
                            {renderCelulaAula(slot.dias.quinta)}
                            {renderCelulaAula(slot.dias.sexta)}
                          </tr>
                        ))}

                        <tr className="bg-slate-950/40">
                          <td
                            colSpan="6"
                            className="p-2 text-xs font-bold text-amber-400 tracking-wider uppercase"
                          >
                            Turno Vespertino
                          </td>
                        </tr>
                        {slotsVespertino.map((slot, idx) => (
                          <tr key={`vesp-${idx}`}>
                            <td className="p-3 font-medium text-slate-400">
                              {slot.horario}
                            </td>
                            {renderCelulaAula(slot.dias.segunda)}
                            {renderCelulaAula(slot.dias.terca)}
                            {renderCelulaAula(slot.dias.quarta)}
                            {renderCelulaAula(slot.dias.quinta)}
                            {renderCelulaAula(slot.dias.sexta)}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
