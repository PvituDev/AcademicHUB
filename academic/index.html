<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <title>IFinityHub - IF Goiano</title>
    <link rel="icon" type="image/png" href="./assets/lg%20IFinityHub.png" />

    <!-- Tailwind & Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- Estilos Encapsulados -->
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/animated-list.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root"></div>

    <!-- Módulos de Dados, Utilitários e Serviços -->
    <script type="text/babel" src="./data/gradePadrao.js"></script>
    <script type="text/babel" src="./utils/moderacao.js"></script>
    <script type="text/babel" src="./utils/notificacoes.js"></script>
    <script type="text/babel" src="./utils/acessibilidade.js"></script>
    <script type="text/babel" src="./services/api.js"></script>

    <!-- Componentes UI Encapsulados -->
    <script type="text/babel" src="./components/AnimatedList.jsx"></script>
    <script type="text/babel" src="./components/BlurText.jsx"></script>
    <script type="text/babel" src="./components/MetallicPaint.jsx"></script>
    <script type="text/babel" src="./components/LandingPage.jsx"></script>
    <script type="text/babel" src="./components/App.jsx"></script>

    <!-- Inicialização -->
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<window.IFinityHub.App />);
    </script>
  </body>
</html>
